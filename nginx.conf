worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /ws {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $bridge_upstream bridge:8000;
      proxy_pass http://$bridge_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_buffering off;
    }

    location = /vscode {
      return 301 /vscode/;
    }

    location /vscode/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $vscode_upstream vscode-web:3000;
      proxy_pass http://$vscode_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400s;
      proxy_buffering off;
    }

    # The site the agent is serving, shown in the preview panel.
    location = /preview {
      return 301 /preview/;
    }

    location /preview/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $preview_upstream agent:4173;
      rewrite ^/preview/(.*)$ /$1 break;
      proxy_pass http://$preview_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400s;
      proxy_buffering off;
    }

    location / {
      # A previewed page that asks for /style.css means its own file, not ours.
      if ($http_referer ~ "/preview/") {
        rewrite ^ /preview$uri last;
      }
      try_files $uri $uri/ /index.html;
    }
  }
}
