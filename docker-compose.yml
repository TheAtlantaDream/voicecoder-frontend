# The page opens the bridge at /ws on this same origin. Nginx proxies that to the bridge.
# VS Code is served at /vscode/ so the editor iframe is same-origin.
# Publish specs are host:container. Coder overrides them with a free host port per workspace.

services:
  frontend:
    build: .
    ports:
      - "${FRONTEND_PUBLISH:-80:80}"
    environment:
      DEFAULT_BRIDGE_URL: /ws
      TARGET_SAMPLE_RATE: "16000"
      VSCODE_WEB_URL: /vscode/
    depends_on:
      - vscode-web

  vscode-web:
    image: gitpod/openvscode-server:latest
    init: true
    command:
      - --host=0.0.0.0
      - --port=3000
      - --without-connection-token
      - --server-base-path=/vscode
      - --default-folder=/home/workspace/project
    ports:
      - "${VSCODE_PUBLISH:-3000:3000}"
    volumes:
      - vscode-workspace:/home/workspace

volumes:
  vscode-workspace:
    name: ${VC_HOME_VOLUME:-voicecoder-vscode-workspace}
    external: ${VC_HOME_EXTERNAL:-false}
